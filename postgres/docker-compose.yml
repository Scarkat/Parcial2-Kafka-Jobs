services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_retry_service
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=failed_products_db
    ports:
      - "5432:5432" # Izquierda: Tu PC (DBeaver) | Derecha: Contenedor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge